server:
  port: 8761

spring:
  application:
    name: eureka-server

# Eureka服务器配置 - 虚拟机环境
eureka:
  instance:
    hostname: 192.168.214.20  # 虚拟机Eureka服务器地址
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://192.168.214.20:8761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

# 日志配置
logging:
  level:
    com.netflix: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
